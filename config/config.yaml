watcher:
  poll_seconds: 2
  stable_seconds: 4
  extensions: [.wav, .mp3, .m4a, .aac, .flac, .ogg, .mp4]

transcription:
  language: es
  beam_size: 5
  vad_filter: true
  word_timestamps: true
  progress_log_interval_percent: 5

diarization:
  min_speakers: null
  max_speakers: null

session:
  intro_window_seconds: 180
  fallback_timezone: America/Mexico_City

cleanup:
  enabled: true
  # Keep ambiguous discourse words (for example, `este`) unless explicitly opted in.
  fillers: [eh, em, mmm, mm]
  collapse_repetitions: true

voice_profiles:
  enabled: true
  store_path: /app/data/profiles/profiles.json
  # Conservative starting values; tune against local enrollment/meeting samples.
  max_cosine_distance: 0.25
  min_distance_margin: 0.05
  min_segment_seconds: 1.5
  max_seconds_per_speaker: 30

output:
  markdown: true
  json: true
  srt: true
